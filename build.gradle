//file:noinspection DependencyNotationArgument

buildscript {
    apply from: './versions.gradle'
    addRepos(repositories) //增加代码仓库
    dependencies {
        classpath deps.android_gradle_plugin
        classpath deps.android_maven_gradle_plugin
        //图片压缩
        classpath 'com.chenenyu:img-optimizer:1.3.0'
        //美团多渠道打包
        //classpath 'com.meituan.android.walle:plugin:1.1.6'
        //滴滴的质量优化框架
        if (isNeedPackage.toBoolean() && isUseBooster.toBoolean()) {
            classpath deps.booster.gradle_plugin
            classpath deps.booster.task_processed_res
            classpath deps.booster.task_resource_deredundancy
        }
        //AndServer
        classpath 'cn.ppps.andserver:plugin:2.1.12'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://repo1.maven.org/maven2/' }
        maven { url 'https://oss.sonatype.org/content/repositories/public' }
        maven { url "https://jitpack.io" }
    }

    // 将构建文件统一输出到项目根目录下的 build 文件夹
    setBuildDir(new File(rootDir, "build/${path.replaceAll(':', '/')}"))
}

// Keep Kotlin runtime artifacts aligned with the Kotlin compiler and R8 toolchain.
def kotlinStdlibVersion = rootProject.ext.versions.kotlin
subprojects { subproject ->
    subproject.configurations.configureEach { configuration ->
        configuration.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        configuration.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        configuration.resolutionStrategy.eachDependency { details ->
            def req = details.requested
            if (req.group != 'org.jetbrains.kotlin') return
            if (req.name.startsWith('kotlin-stdlib') || req.name == 'kotlin-reflect') {
                details.useVersion kotlinStdlibVersion
                details.because 'SoloPay: align Kotlin artifacts (fix duplicate stdlib / R8)'
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
