plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    namespace 'cn.solopay'
    compileSdkVersion rootProject.ext.build_versions.target_sdk

    defaultConfig {
        minSdkVersion rootProject.ext.build_versions.min_sdk
        targetSdkVersion rootProject.ext.build_versions.target_sdk
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        viewBinding true
    }
    lint {
        abortOnError false
    }
}

dependencies {
    // 与 app 模块对齐，降低传递 Kotlin stdlib 版本，避免与 XRouter transform 冲突
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation rootProject.ext.deps.androidx.design
    implementation rootProject.ext.deps.constraint_layout
    implementation rootProject.ext.deps.androidx.recyclerview

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0'
    implementation 'androidx.fragment:fragment-ktx:1.5.5'
    implementation 'androidx.activity:activity-ktx:1.6.1'

    implementation rootProject.ext.deps.okhttp3
    implementation rootProject.ext.deps.gson

    // XUI 体系（与 SmsForwarder 主工程一致）
    implementation rootProject.ext.deps.xlibrary.xui
    implementation rootProject.ext.deps.xlibrary.xutil_core
    implementation rootProject.ext.deps.xlibrary.xutil_sub
    implementation rootProject.ext.deps.glide

    def room_version = '2.5.2'
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    implementation 'com.github.xuexiangjys.SmartRefreshLayout:refresh-header:1.1.6'
    implementation 'com.github.xuexiangjys.SmartRefreshLayout:refresh-layout:1.1.6'

    implementation 'com.journeyapps:zxing-android-embedded:3.6.0'
}